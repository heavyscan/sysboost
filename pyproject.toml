[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysboost"
version = "0.1.0"
description = "Cross-platform system performance optimizer with visual dashboard"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SysBoost Contributors" }]
keywords = ["performance", "optimizer", "system", "tuning", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Desktop Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
sysboost = "src.ui.app:main"

[project.urls]
Homepage = "https://github.com/sysboost/sysboost"
Repository = "https://github.com/sysboost/sysboost"
Issues = "https://github.com/sysboost/sysboost/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "plugins/*"]
